name: Build Catalyst Client

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/build-client.yml'
      - 'src/**'
      - 'index.html'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.js'
      - 'public/**'

jobs:
  build-client:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: |
          rm -rf node_modules
          npm install --include=optional
          npm install --no-save @rolldown/binding-linux-x64-gnu

      - name: Build frontend
        run: npm run build

      - name: Verify Catalyst client package
        run: |
          test -f client/index.html
          test -f client/client-package.json

      - name: Upload Catalyst client artifact
        uses: actions/upload-artifact@v4
        with:
          name: catalyst-client
          path: client/
          if-no-files-found: error
